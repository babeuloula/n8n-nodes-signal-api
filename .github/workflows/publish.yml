# Publishes the package to npm when a version tag is pushed, with an npm
# provenance statement (required by n8n for verified community nodes).
#
# The tag is the source of truth for the version:
#   git tag 0.4.0 && git push origin 0.4.0
#
# 1. Checks that the tagged commit is on main and that the tag is the next
#    patch, minor or major version (or the same version, to retry a failed run).
# 2. Sets the version in package.json and package-lock.json, and releases the
#    "## Unreleased" section of CHANGELOG.md (see .github/scripts/prepare-release.mjs).
# 3. Runs the tests, then `npm run release` (lint, build, npm publish with provenance).
# 4. Commits these changes on main ("chore(release): <version>").
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# npm authentication, either:
#   - OIDC Trusted Publishing (recommended): on npmjs.com, package settings →
#     Trusted Publishers → GitHub Actions, repository babeuloula/n8n-nodes-signal-api,
#     workflow publish.yml. Leave the NPM_TOKEN secret unset.
#   - or a Granular Access Token (read and write, "bypass 2FA" enabled) stored in
#     the NPM_TOKEN secret of the repository.
#
# Step 4 pushes to main with the GITHUB_TOKEN: if main is protected, allow
# GitHub Actions to bypass the protection, or the release commit will fail
# (the package is published anyway).

name: Publish

on:
  push:
    tags:
      - '*.*.*'

# Never run two releases at the same time (both would push to main)
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Required to push the release commit to main.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: needed to check the tag is on main and to
          # list the commits since the previous tag
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Check that the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main: tag a commit of main."
            exit 1
          fi

      - name: Set the version from the tag
        run: |
          node .github/scripts/prepare-release.mjs "$GITHUB_REF_NAME"
          npm version "$GITHUB_REF_NAME" --no-git-tag-version --allow-same-version

      - name: Run tests
        run: 'npm test'

      - name: Release
        # Lint, build, then npm publish with provenance (n8n-node release in CI).
        # OIDC: leave NPM_TOKEN unset. Token: it is written to .npmrc here.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit the release on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to commit: main is already at $GITHUB_REF_NAME"
            exit 0
          fi
          git commit -m "chore(release): $GITHUB_REF_NAME [skip ci]"
          # main may have moved since the tag was pushed
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
